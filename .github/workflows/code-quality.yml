name: Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security:
    name: Security Scan (Root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          skip-dirs: "swapbuds-frontend,swapbuds-backend"
