name: Docker Compose

on:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - ".github/workflows/docker-compose.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: docker-compose config

      - name: Check docker-compose services
        run: |
          echo "Services defined in docker-compose.yml:"
          docker-compose config --services

  test:
    name: Test Docker Services
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker-compose exec -T postgres pg_isready -U swapbuds_dev; do sleep 2; done'

          echo "Waiting for Redis..."
          timeout 60 bash -c 'until docker-compose exec -T redis redis-cli ping; do sleep 2; done'

      - name: Check service status
        run: docker-compose ps

      - name: Show service logs
        if: failure()
        run: docker-compose logs

      - name: Stop services
        if: always()
        run: docker-compose down -v
